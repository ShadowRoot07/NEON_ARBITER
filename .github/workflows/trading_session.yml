name: Neon Arbiter Session

on:
  push:
    branches:
      - main # Se activará cada vez que hagas push o merge a main
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel # <--- ESTO SOLUCIONA EL CRASH
          pip install -r requirements.txt

      - name: Run Neon Arbiter Session
        env:
          BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
          BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python main.py bot_on --duration 45

      - name: Commit and Push Logs
        run: |
          git config --global user.name "Neon-Arbiter-Bot"
          git config --global user.email "bot@neonarbiter.com"
          git add logs/*.txt
          git commit -m "🚀 Auto-Log: Session $(date +'%Y-%m-%d %H:%M')" || echo "No changes to commit"
          git push

