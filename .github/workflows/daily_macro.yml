name: Neon Arbiter - Daily Macro Conscience

on:
  schedule:
    # Se dispara todos los días a las 14:00 UTC (10:00 AM Hora de Venezuela)
    - cron: '0 14 * * *'
  workflow_dispatch: # Nos permite activar el bot manualmente desde la interfaz de GitHub si queremos forzar una prueba

jobs:
  analyze_market:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Clonar el repositorio
      uses: actions/checkout@v4

    - name: 🐍 Configurar entorno de Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11' # Versión estable y rápida

    - name: ⚡ Instalar dependencias del sistema y caché
      run: |
        python -m pip install --upgrade pip
        # Eliminamos python-dotenv ya que no se usará en la nube
        pip install httpx

    - name: 🧠 Ejecutar Oráculo Spica (Análisis Fundamental y Despacho)
      env:
        # Inyectamos de forma segura las llaves guardadas en los secretos de GitHub
        GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        CRYPTOCOMPARE_API_KEY: ${{ secrets.CRYPTOCOMPARE_API_KEY }}
        DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      run: |
        # Ejecutamos usando la bandera modular que reparamos ayer
        python -m cron.discord_notifier

